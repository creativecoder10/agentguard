# AgentGuard policy — the allowlist + sandbox rules PolicyMiddleware enforces
# on every tool call. Edit this file to change what the proxied agent can do;
# no code change needed for a policy change.

sandbox_root: "./sandbox"

tools:
  read_file:
    risk: read
  write_file:
    risk: write
  delete_file:
    risk: destructive # hard-denied in Phase 1 — see docs/PRD.md

blocked_extensions:
  - .env
  - .pem
  - .key
  - .p12

# Output-side checks on what a tool RETURNS, before the agent sees it
# (app/result_guard.py). on_injection: "flag" fences the output as untrusted
# data and lets it through; "block" replaces it with an error.
result_scanning:
  enabled: true
  redact_secrets: true
  on_injection: flag
